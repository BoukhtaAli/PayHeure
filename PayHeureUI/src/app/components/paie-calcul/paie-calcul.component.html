<div class="container paie-page">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <h1 class="page-title">{{ 'PAIE.TITLE' | translate }}</h1>
  <p class="page-subtitle">{{ 'PAIE.SUBTITLE' | translate }}</p>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="panel">
        <h2 class="panel-title">{{ 'PAIE.STEP_1' | translate }}</h2>
        <app-employee-search (employeeSelected)="onEmployeeSelected($event)"></app-employee-search>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="panel" [class.disabled]="!selectedEmployee">
        <h2 class="panel-title">{{ 'PAIE.STEP_2' | translate }}</h2>

        <p *ngIf="!selectedEmployee" class="text-muted">{{ 'PAIE.NO_EMPLOYEE_SELECTED' | translate }}</p>

        <form *ngIf="selectedEmployee" [formGroup]="form" (ngSubmit)="calculer()" class="row g-3 align-items-end">
          <!--
            Champs date et heure pilotés par flatpickr (calendrier/horloge dessinés par la
            librairie), pas par <input type="date"/"time"> : ces widgets natifs affichent/saisissent
            dans l'ordre, le séparateur et le format 12h/24h de la langue/région du navigateur
            (souvent MM/dd/yyyy et AM/PM en anglais US), indépendamment de la langue choisie dans
            l'appli. Format imposé ici via appFlatpickr : dd-MM-yyyy et HH:mm (24h), jamais d'AM/PM.
          -->
          <!-- 4 colonnes de 3 = 12 : les dates/heures remplissent exactement la première ligne,
               le tarif horaire qui suit passe donc naturellement à la ligne suivante. -->
          <div class="col-md-3">
            <label for="dateDebut" class="form-label">{{ 'PAIE.DATE_START' | translate }}</label>
            <input id="dateDebut" type="text" placeholder="dd-MM-yyyy" dir="ltr" class="form-control"
                   [appFlatpickr]="dateOptions" formControlName="dateDebut">
          </div>
          <div class="col-md-3">
            <label for="heureDebut" class="form-label">{{ 'PAIE.TIME_START' | translate }}</label>
            <input id="heureDebut" type="text" placeholder="HH:mm" dir="ltr" class="form-control"
                   [appFlatpickr]="heureOptions" formControlName="heureDebut">
          </div>
          <div class="col-md-3">
            <label for="dateFin" class="form-label">{{ 'PAIE.DATE_END' | translate }}</label>
            <input id="dateFin" type="text" placeholder="dd-MM-yyyy" dir="ltr" class="form-control"
                   [appFlatpickr]="dateOptions"
                   [class.is-invalid]="form.errors?.['invalidPeriod'] && form.get('dateFin')?.touched"
                   formControlName="dateFin">
          </div>
          <div class="col-md-3">
            <label for="heureFin" class="form-label">{{ 'PAIE.TIME_END' | translate }}</label>
            <input id="heureFin" type="text" placeholder="HH:mm" dir="ltr" class="form-control"
                   [appFlatpickr]="heureOptions"
                   [class.is-invalid]="form.errors?.['invalidPeriod'] && form.get('dateFin')?.touched"
                   formControlName="heureFin">
          </div>

          <div class="col-md-4">
            <label for="tauxHoraire" class="form-label">{{ 'PAIE.HOURLY_RATE' | translate }}</label>
            <input id="tauxHoraire" type="number" step="0.01" min="0.01" class="form-control"
                   formControlName="tauxHoraire" [placeholder]="'PAIE.HOURLY_RATE_PLACEHOLDER' | translate">
          </div>
          <div class="col-12" *ngIf="form.errors?.['invalidPeriod'] && form.get('dateFin')?.touched">
            <div class="alert alert-danger py-2 mb-0">{{ 'PAIE.INVALID_PERIOD' | translate }}</div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-accent" [disabled]="form.invalid">
              <i class="fas fa-calculator" aria-hidden="true"></i>
              {{ 'PAIE.CALCULATE' | translate }}
            </button>
          </div>
        </form>

        <div class="alert alert-danger mt-3" *ngIf="errorMessage">{{ errorMessage }}</div>
      </div>
    </div>
  </div>

  <div class="mt-4" *ngIf="result">
    <app-pointage-result [result]="result"></app-pointage-result>
  </div>
</div>
