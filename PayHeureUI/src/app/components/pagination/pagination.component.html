<nav *ngIf="totalPages > 1" [attr.aria-label]="ariaLabel" class="d-flex justify-content-center mt-3">
  <ul class="pagination mb-0">
    <li class="page-item" [class.disabled]="page === 0">
      <button type="button" class="page-link" (click)="goToPage(page - 1)" [disabled]="page === 0">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        <span class="visually-hidden">{{ 'PAGINATION.PREV_PAGE' | translate }}</span>
      </button>
    </li>

    <li class="page-item" *ngFor="let pageNumber of visiblePages" [class.active]="pageNumber === page" [class.disabled]="pageNumber === null">
      <button *ngIf="pageNumber !== null; else ellipsis" type="button" class="page-link" (click)="goToPage(pageNumber)">
        {{ pageNumber + 1 }}
      </button>
      <ng-template #ellipsis>
        <span class="page-link">…</span>
      </ng-template>
    </li>

    <li class="page-item" [class.disabled]="page >= totalPages - 1">
      <button type="button" class="page-link" (click)="goToPage(page + 1)" [disabled]="page >= totalPages - 1">
        <span class="visually-hidden">{{ 'PAGINATION.NEXT_PAGE' | translate }}</span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </li>
  </ul>
</nav>
