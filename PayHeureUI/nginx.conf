server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Sert le fichier demandé s'il existe, sinon retombe sur index.html
        # pour laisser Angular Router gérer la route côté client.
        try_files $uri $uri/ /index.html;
    }
}
