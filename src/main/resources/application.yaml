spring:
  application:
    name: payheure-backend
  servlet:
    encoding:
      # Certains assets tiers (ex. flag-icons.min.css) n'ont ni BOM ni "@charset" en tête de
      # fichier ; sans ça, le navigateur retombe sur Windows-1252 pour lire le fichier servi en
      # "Content-Type: text/css" (sans paramètre charset), et un caractère UTF-8 multioctet comme
      # l'espace insécable (0xC2 0xA0) est alors lu comme deux caractères latin-1 ("Â" + espace).
      # Forcer charset=UTF-8 sur toutes les réponses évite ce mojibake pour cet asset et pour
      # tout autre fichier statique qui ne déclarerait pas son encodage.
      charset: UTF-8
      force: true
  datasource:
    # Adapter ce chemin à l'emplacement du fichier .accdb sur le poste client.
    url: jdbc:ucanaccess://C:/PayHeure/payheureDb.accdb;newDatabaseVersion=V2010
    driver-class-name: net.ucanaccess.jdbc.UcanaccessDriver
    username:
    password:
  jpa:
    hibernate:
      # "update" n'est pas fiable avec UCanAccess (retente un CREATE TABLE à chaque démarrage).
      # Schéma à créer une fois via le bootstrap décrit dans le README, puis laisser "none".
      ddl-auto: none
    show-sql: false
    # Pas de dialecte Hibernate "Access" dédié : HSQLDialect est celui que UCanAccess recommande.
    database-platform: org.hibernate.dialect.HSQLDialect
    # Les services renvoient des DTO : aucune donnée n'est chargée hors transaction.
    open-in-view: false
  jackson:
    # Depuis Jackson 3 (Boot 4), WRITE_DATES_AS_TIMESTAMPS est un DateTimeFeature et non plus un
    # SerializationFeature : spring.jackson.serialization.write-dates-as-timestamps ne bind plus
    # (l'enum SerializationFeature n'a plus de constante de ce nom, il faut passer par datatype.datetime).
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null